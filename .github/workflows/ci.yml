name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # same CPython as Pyodide 314.x
      - run: pip install -r py/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results

  deploy:
    # Publish the static build to GitHub Pages from the main branch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the manual (docs/manual/build.py → web/dist/manuals): pandoc 3.9, XeLaTeX,
      # and the guess package for the generated appendices
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r py/requirements-dev.txt
      - name: Install pandoc and XeLaTeX
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-1-amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./pandoc.deb texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu lmodern
      - run: python docs/manual/build.py
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
