<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GUESS</title>
    <!-- Static hosts can't send COOP/COEP headers; this service worker adds them
         so Python can be interrupted (SharedArrayBuffer). No-op when already isolated. -->
    <script src="coi-serviceworker.js"></script>
    <script>
      try { const t = localStorage.getItem("guess.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3 4L12 3L8 12Z' stroke='%23999' fill='none'/%3E%3Ccircle cx='3' cy='4' r='2' fill='%23ff1f6b'/%3E%3Ccircle cx='12' cy='3' r='2' fill='%231d4ed8'/%3E%3Ccircle cx='8' cy='12' r='2' fill='%23fcd870'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">GUESS</span>
      <nav class="menubar" aria-label="Main menu">
        <div class="menu-root">
          <button class="menu-title" aria-haspopup="menu" aria-expanded="false">File</button>
          <div class="menu-pop" role="menu" hidden>
            <button role="menuitem" id="open" title="Open a graph (.gdf, .gexf, .graphml, .gml, .dot, .net, .dl, .csv), a .py script, or an image — or drop files on the page">Open…<kbd>⌘O</kbd></button>
            <button role="menuitem" id="sample">Sample graph</button>
            <button role="menuitem" id="fresh-start" title="Forget everything GUESS saved in this browser (the autosaved session, command history, settings) and reload empty">Start fresh…</button>
            <button role="menuitem" id="open-url">Open from URL…</button>
            <button role="menuitem" id="paste-data" title="Paste an edge table, node table, adjacency matrix or list">Paste a table…</button>
            <button role="menuitem" id="open-ndex">Open from NDEx…</button>
            <button role="menuitem" data-run='makeFromSPARQL("""SELECT ?source ?sourceLabel ?target ?targetLabel WHERE {\n  ?source wdt:P737 ?target .\n  ?source wdt:P106 wd:Q4964182 .\n  SERVICE wikibase:label { bd:serviceParam wikibase:language \"en\". }\n} LIMIT 400""")' title="Philosophers and who influenced them, from Wikidata">Wikidata example: philosophers' influences</button>
            <hr />
            <button role="menuitem" id="save" title="Download a .guess session file (graph, fields, states, hulls, legends)">Save session<kbd>⌘S</kbd></button>
            <button role="menuitem" data-run='saveHistory("history.py")'>Save commands as script</button>
            <button role="menuitem" id="share-link" title="A link that opens this graph and view (the data is in the link itself)">Copy share link</button>
            <button role="menuitem" id="share-viewer" title="A link that opens this graph as a read-only viewer (no console)">Copy viewer link</button>
            <hr />
            <div class="menu-label">Export</div>
            <button role="menuitem" id="png">Image (PNG)</button>
            <button role="menuitem" id="svg">Vector image (SVG)</button>
            <button role="menuitem" data-run='exportGEXF("graph.gexf")'>GEXF for Gephi</button>
            <button role="menuitem" data-run='exportGraphML("graph.graphml")'>GraphML</button>
            <button role="menuitem" data-run='exportGML("graph.gml")'>GML</button>
            <button role="menuitem" data-run='exportDOT("graph.dot")'>Graphviz DOT</button>
            <button role="menuitem" data-run='exportCSV("edges.csv"); exportCSV("nodes.csv", "nodes")'>CSV tables</button>
            <button role="menuitem" id="export-notebook" title="The console's cells as a Jupyter notebook, with a snapshot of the graph">Jupyter notebook (.ipynb)</button>
            <button role="menuitem" id="export-report" title="A self-contained HTML page: graph snapshot, legends and the cells you ran">Report (HTML)</button>
          </div>
        </div>
        <div class="menu-root">
          <button class="menu-title" aria-haspopup="menu" aria-expanded="false">Edit</button>
          <div class="menu-pop" role="menu" hidden>
            <button role="menuitem" id="undo" title="Undo the last command">Undo<kbd>⌘Z</kbd></button>
            <button role="menuitem" id="redo" title="Redo">Redo<kbd>⇧⌘Z</kbd></button>
            <hr />
            <button role="menuitem" data-run="select(g.nodes)">Select all nodes</button>
            <button role="menuitem" data-run="select(ninverse(sel))">Invert selection</button>
            <button role="menuitem" id="delete-sel" title="Remove the selected nodes and their edges (undoable)">Delete selected nodes<kbd>⌫</kbd></button>
            <button role="menuitem" data-run="select()">Clear selection<kbd>Esc</kbd></button>
            <hr />
            <button role="menuitem" data-run="collapse(sel)">Collapse selection into a group</button>
            <button role="menuitem" data-run="expandAll()">Expand all groups</button>
            <button role="menuitem" data-run="subgraph(sel)">New graph from selection</button>
            <hr />
            <button role="menuitem" data-run="showOnly(sel)">Show only the selection</button>
            <button role="menuitem" data-run="showAll()">Show everything</button>
          </div>
        </div>
        <div class="menu-root">
          <button class="menu-title" aria-haspopup="menu" aria-expanded="false">View</button>
          <div class="menu-pop" role="menu" hidden>
            <button role="menuitem" id="center" title="Fit the graph (or double-click the background)">Fit graph</button>
            <hr />
            <button role="menuitemcheckbox" id="btn-table" aria-pressed="false" title="Data table of nodes and edges (table())">Data table</button>
            <button role="menuitemcheckbox" id="btn-style" aria-pressed="false" title="Map fields to colours, sizes, labels and shapes; saved styles">Style panel</button>
            <button role="menuitemcheckbox" id="btn-filter" aria-pressed="false" title="Filter what is shown with live sliders">Filter panel</button>
            <button role="menuitemcheckbox" id="btn-vars" aria-pressed="false" title="Your variables, saved states and styles">Variables</button>
            <button role="menuitemcheckbox" id="btn-present" aria-pressed="false" title="Step through saved views with notes (← →)">Presentation</button>
            <button role="menuitemcheckbox" id="btn-timeline" aria-pressed="false" title="Scrub or play through time (ranges or a field such as year)">Timeline</button>
            <hr />
            <button role="menuitemcheckbox" id="curved" aria-pressed="false" title="Gephi-style curved edges (curvedEdges())">Curved edges</button>
            <button role="menuitem" data-run="bundleEdges()" title="MINGLE: merge edges that run alike into bundles (good for large graphs)">Bundle edges (MINGLE)</button>
            <button role="menuitem" data-run="bundleEdges(method='fdeb')" title="Force-directed edge bundling: smooth, organic bundles">Bundle edges (force-directed)</button>
            <button role="menuitem" data-run="unbundleEdges()">Straighten edges</button>
            <button role="menuitemcheckbox" id="label-outlines" aria-pressed="false">Label outlines</button>
            <button role="menuitemcheckbox" id="label-cull" aria-pressed="false">Hide overlapping labels</button>
            <hr />
            <button role="menuitem" id="find-output">Find in console output<kbd>⇧⌘F</kbd></button>
            <button role="menuitemcheckbox" id="vim-keys" aria-pressed="false">Vim keys in the code cell</button>
            <button role="menuitemcheckbox" id="show-moves" aria-pressed="false" title="Node drags are recorded as commands (undo, history, logs); show them in the console">Show node moves in the console</button>
            <hr />
            <div class="menu-label">Theme</div>
            <button role="menuitemradio" data-theme-choice="auto" aria-pressed="true">Automatic</button>
            <button role="menuitemradio" data-theme-choice="light" aria-pressed="false">Light</button>
            <button role="menuitemradio" data-theme-choice="dark" aria-pressed="false">Dark</button>
          </div>
        </div>
        <div class="menu-root">
          <button class="menu-title" aria-haspopup="menu" aria-expanded="false">Layout</button>
          <div class="menu-pop" role="menu" hidden>
            <button role="menuitem" data-run="forceAtlas2Layout()">ForceAtlas2</button>
            <button role="menuitem" data-run="forceAtlas2Layout(linLog=true)">ForceAtlas2 (LinLog clusters)</button>
            <button role="menuitem" data-run="gemLayout()">GEM</button>
            <button role="menuitem" data-run="kkLayout()">Kamada–Kawai</button>
            <button role="menuitem" data-run="frLayout()">Fruchterman–Reingold</button>
            <button role="menuitem" data-run="mdsLayout()">MDS</button>
            <hr />
            <button role="menuitem" data-run="circleLayout()">Circle</button>
            <button role="menuitem" data-run="sugiyamaLayout()">Hierarchy</button>
            <button role="menuitem" data-run="radialLayout(sel[0] if len(sel) else g.nodes[0])">Radial around selection</button>
            <button role="menuitem" data-run="binPackLayout()">Pack components</button>
            <button role="menuitem" data-run="hiveLayout()" title="Nodes on radial axes by role, placed by degree (hiveLayout(field, position) for your own axes)">Hive plot</button>
            <button role="menuitem" data-run="treeLayout(sel[0] if len(sel) else None)">Tree (from selection)</button>
            <hr />
            <button role="menuitem" data-run="dotLayout()" title="Graphviz dot: layers, few crossings, edges routed around nodes">Layered, routed edges (dot)</button>
            <button role="menuitem" data-run="neatoLayout()" title="Graphviz neato: distances on screen follow distances in the graph">Stress (neato)</button>
            <button role="menuitem" data-run="sfdpLayout()" title="Graphviz sfdp: multilevel, for thousands of nodes">Large graph (sfdp)</button>
            <button role="menuitem" data-run="drlLayout()" title="igraph DrL: tens of thousands of nodes, clusters far apart">Very large graph (DrL)</button>
            <hr />
            <button role="menuitem" data-run="removeOverlap()" title="Graphviz PRISM: separates nodes while keeping the layout's shape">Remove overlaps (keep shape)</button>
            <button role="menuitem" data-run="noverlapLayout()">Remove overlaps</button>
            <button role="menuitem" data-run="labelAdjustLayout()">Remove label overlaps</button>
            <button role="menuitem" data-run="rotateLayout(90)">Rotate 90°</button>
            <button role="menuitem" data-run="mirrorLayout()">Mirror</button>
          </div>
        </div>
        <div class="menu-root">
          <button class="menu-title" aria-haspopup="menu" aria-expanded="false">Analyze</button>
          <div class="menu-pop" role="menu" hidden>
            <button role="menuitem" data-run="graphStats()">Graph statistics</button>
            <button role="menuitem" data-run="cl = louvainClusters()&#10;colorize(modularity_class)&#10;legendFor(modularity_class)">Find communities</button>
            <button role="menuitem" data-run="cl = leidenClusters()&#10;colorize(leiden_class)&#10;legendFor(leiden_class)" title="igraph Leiden: every community internally connected">Find communities (Leiden)</button>
            <hr />
            <button role="menuitem" data-run="sizeBy(pagerank, 5, 40, 'sqrt')">Size by PageRank</button>
            <button role="menuitem" data-run="sizeBy(betweenness, 5, 40, 'sqrt')">Size by betweenness</button>
            <button role="menuitem" data-run="colorBy(closeness, '#fff3b0', '#d7263d')">Colour by closeness</button>
            <hr />
            <button role="menuitem" data-run="showOnly(giantComponent())">Largest component only</button>
            <button role="menuitem" data-run="showOnly(kCore(2))">2-core only</button>
            <button role="menuitem" data-run="plotHistogram(totaldegree)">Degree histogram</button>
          </div>
        </div>
        <div class="menu-root">
          <button class="menu-title" aria-haspopup="menu" aria-expanded="false">Help</button>
          <div class="menu-pop" role="menu" hidden>
            <button role="menuitemcheckbox" id="btn-help" aria-pressed="false" title="Searchable commands and examples">Help and examples<kbd>F1</kbd></button>
            <button role="menuitem" id="btn-gestures" title="Selecting, dragging with meaning, click tools and panels, with pictures">Mouse and gestures</button>
            <button role="menuitem" id="btn-palette" title="Search commands, examples, nodes and values">Search everything…<kbd>⌘K</kbd></button>
            <button role="menuitem" data-run="history()">Commands run so far</button>
            <hr />
            <button role="menuitem" id="btn-manual" title="The GUESS manual as a web page, PDF, EPUB or Word (opens in a new tab)">Manual</button>
            <button role="menuitem" id="btn-cookbooks" title="GUESS cookbooks: runnable recipes for social networks, biology, text, infrastructure, software, investigations and ecology (opens in a new tab)">Cookbooks</button>
            <button role="menuitem" id="btn-github" title="Source code, issues and releases (opens in a new tab)">GitHub</button>
          </div>
        </div>
      </nav>
      <input id="file" type="file" accept=".guess,.gdf,.gexf,.net,.paj,.graphml,.xml,.gml,.dot,.gv,.dl,.csv,.tsv,.py,image/*" multiple hidden />
      <span class="toolgroup" role="group" aria-label="Click tool">
        <button data-tool="select" aria-pressed="true" title="Click a node to highlight its neighbourhood (again, or Esc, to clear); shift-drag box, alt-drag lasso">Select</button>
        <button data-tool="lens" aria-pressed="false" title="Excentric lens (L switches between Select and Lens): lists the labels of the nodes under it; wheel resizes, click pins it to select or filter">◎ Lens</button>
        <button data-tool="path" aria-pressed="false" title="Click two nodes to colour a shortest path between them">Path</button>
        <button data-tool="heat" aria-pressed="false" title="Click a node to colour every node by its distance from it">Heat</button>
        <button data-tool="paint" aria-pressed="false" title="Click nodes to paint them (shift-click paints the neighbours too)">Paint</button>
        <input type="color" id="paint-color" value="#e8384f" title="Colour for Path and Paint" />
      </span>
      <button id="search" class="search-btn" title="Search commands, examples, nodes and values (Cmd/Ctrl+K)">Search<kbd>⌘K</kbd></button>
      <button id="stop" disabled title="Interrupt the running command (Esc)">Stop</button>
      <span id="status" class="status"></span>
    </header>
    <main class="split">
      <div class="view-col">
        <div id="graph-tabs" class="graph-tabs" role="tablist" aria-label="Graphs" hidden></div>
        <div class="graph-row">
          <aside id="sidebar" class="sidebar" hidden>
            <div class="sidebar-head">
              <span class="sidebar-tabs" role="tablist">
                <button data-side="help" role="tab">Help</button>
                <button data-side="style" role="tab">Style</button>
                <button data-side="filter" role="tab">Filter</button>
                <button data-side="vars" role="tab">Variables</button>
              </span>
              <button class="sidebar-close" title="Close" aria-label="Close panel">✕</button>
            </div>
            <div id="side-help" class="sidebar-body" hidden></div>
            <div id="side-style" class="sidebar-body" hidden></div>
            <div id="side-filter" class="sidebar-body" hidden></div>
            <div id="side-vars" class="sidebar-body" hidden></div>
          </aside>
          <div id="graph" class="graph"><div id="legends" class="legends"></div>
            <div id="tipcard" class="tipcard" hidden><span class="tipcard-text"></span><button class="tipcard-show">Show me</button><button class="tipcard-close" aria-label="Dismiss">✕</button></div>
            <div id="present" class="present" hidden>
              <button id="slide-prev" title="Previous slide (←)">◀</button>
              <span id="slide-pos" class="slide-pos"></span>
              <button id="slide-next" title="Next slide (→)">▶</button>
              <span id="slide-note" class="slide-note"></span>
              <span class="present-edit">
                <input id="slide-new-note" placeholder="note for a new slide" />
                <button id="slide-add" title="Save the current graph and view as a slide">Add slide</button>
                <button id="slide-remove" title="Delete the current slide">Delete</button>
              </span>
              <button id="present-close" title="Leave presentation mode">✕</button>
            </div>
          </div>
          <aside id="dock-right" class="dock dock-right" hidden></aside>
        </div>
        <div id="timeline" hidden></div>
        <section id="table-pane" class="table-pane" hidden>
          <div class="table-resize" title="Drag to resize"></div>
          <button class="table-close" title="Close the table" aria-label="Close the table">✕</button>
          <div id="table-body" class="table-body"></div>
        </section>
        <div id="dock-bottom" class="dock dock-bottom" hidden></div>
      </div>
      <div class="divider" id="divider" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
      <section id="console"></section>
    </main>
    <dialog id="paste-dialog" class="paste-dialog">
      <h3>Paste a table</h3>
      <p>An edge table (Source, Target, …), a node table (Id, Label, …), an adjacency matrix or an adjacency list — comma, tab or semicolon separated.</p>
      <textarea rows="12" spellcheck="false" placeholder="Source,Target,Weight&#10;a,b,2&#10;b,c,1"></textarea>
      <div class="paste-actions"><button id="paste-cancel">Cancel</button><button id="paste-load" class="primary">Load</button></div>
    </dialog>
    <div id="tip" class="tip" hidden></div>
    <div id="menu" class="menu" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
